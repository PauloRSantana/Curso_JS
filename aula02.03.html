<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logicia de Programacao</title>
</head>
<body>
    <h1>Logicia de Programacao</h1>

    <script>
        //Pedir para o usuário digitar um número
        var n1 = prompt('Digite um número');
            //Converta em um número inteiro
         n1 = parseInt(n1);
        //Pedir para o usuário digitar outro número
        var n2 = prompt('Digite outro número');
            //Converter em número inteiro
        n2 =  parseInt(n2)
        //Mostrar a subtração concatenando com o texto
            alert('A subtração é: ' + (n1-n2));

        //Mostrar a multiplicação concatenando o texto
            alert('A multiplicação é: ' + (n1*n2));
            
        //Mostrar a divisão concatenando o texto
            alert('A divisão é: ' + (n1/n2));

        //Mostrar a soma concatenando o texto
            alert('A soma é: ' + (n1+n2));
    </script>
</body>
</html>
