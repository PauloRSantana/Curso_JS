    <h1>Logica de Programação com Javascript</h1>
    
</body>

<script>
    //Pedir para um usuário digitar dois número e mostrar uma mensagem informando se for aprovado ou não. A nota de corte é 5

    var n1 = parseFloat(prompt('Digite um número'));
    var n2 = parseFloat(prompt('Digite outro número'));

    var media = (n1 + n2) / 2;

    if (media >5){
        alert('Parabéns! Você foi aprovado');
    }else{
        alert('Desculpe, mas não foi dessa vez!')
    }



</script>
</html>
